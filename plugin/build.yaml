version: "0.3.0.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Finds and downloads missing local movie trailers from YouTube via yt-dlp."
imageUrl: "https://codeberg.org/grexe/jellyfin-trailer-fetcher/raw/branch/plugin/plugin/images/logo.png"
description: >
  Scans the movie library for missing local trailers, searches YouTube via yt-dlp
  using sequel-aware title matching, downloads matches into "<title>-trailer.ext"
  next to the movie, and can migrate movies into their own folder - required for
  Jellyfin to recognize a local trailer at all when movies otherwise share a flat
  folder (see https://github.com/jellyfin/jellyfin/issues/10077).
category: "General"
owner: "grexe"
artifacts:
- "Jellyfin.Plugin.TrailerFetcher.dll"
changelog: >
  0.3.0.0: Retargeted to Jellyfin 10.11.x (net9.0; 10.11.x's packages dropped net8.0
  support) - TaskTriggerInfo.Type is now the TaskTriggerInfoType enum instead of a
  string constant. No functional change otherwise.


  0.2.0.0: Cookie file upload (for authenticated/age-restricted YouTube access) and
  per-library scan scoping. Trailer search/download and folder migration logic
  ported from the standalone script still lands in a follow-up release - this
  build is for settings/wiring testing only, it does not fetch trailers yet.


  0.1.0.0: Initial plugin skeleton - configuration page and scheduled task wiring.
