framework: "net9.0"
overview: "Finds and downloads missing local movie trailers from YouTube via yt-dlp."
imageUrl: "https://codeberg.org/grexe/jellyfin-trailer-fetcher/raw/branch/plugin/plugin/images/logo.png"
description: >
  Scans the movie library for missing local trailers, searches YouTube via yt-dlp
  using sequel-aware title matching, downloads matches into "<title>-trailer.ext"
  next to the movie, and can migrate movies into their own folder - required for
  Jellyfin to recognize a local trailer at all when movies otherwise share a flat
  folder (see https://github.com/jellyfin/jellyfin/issues/10077).
category: "General"
owner: "grexe"
artifacts:
- "Jellyfin.Plugin.TrailerFetcher.dll"
changelog: >
  0.4.0.0: Fixed a real stability bug: the compiled assembly never had its own
  <Version>/<AssemblyVersion> set, so it silently defaulted to .NET's "1.0.0.0"
  regardless of what build.yaml/manifest.json declared. That mismatch between the
  assembly's actual version and what Jellyfin installed/tracked caused the dashboard
  to revert to "1.0.0.0" after a task run or server restart, and made uninstall fail
  outright. package.sh now keeps build.yaml's version in sync with the csproj
  automatically, so this can't drift again. Also: moved the scheduled task into the
  "Library" category (no need for its own single-entry category), fixed a stray
  quoted-string artifact in one log line ("librar\"y\"" -> "library"), and added
  diagnostic logging (every known library's id/name/collection-type, plus an
  unscoped movie count for comparison) to help track down a reported "0 movies
  found" when scoped to a specific library - not yet reproduced locally.


  0.3.2.0: This plugin's own log entries (scheduled task runs, cookie upload/removal,
  etc.) now also get mirrored into their own file
  (plugins/Jellyfin.Plugin.TrailerFetcher/trailer-fetcher.log) via a scoped
  ILoggerProvider, so a run can be inspected without wading through the main server
  log. No change to what's logged, just where.


  0.3.1.0: Clearer cookies-file guidance on the settings page - no browser exposes a
  plain "cookies.txt" to point to (Firefox stores cookies in an SQLite database, not
  a text file); names the actual export extension needed ("Get cookies.txt LOCALLY").
  Also fixed the catalog logo being cropped (padded the artwork so a wider-than-tall
  crop doesn't clip it) and replaced it with a solid-background badge.


  0.3.0.0: Retargeted to Jellyfin 10.11.x (net9.0; 10.11.x's packages dropped net8.0
  support) - TaskTriggerInfo.Type is now the TaskTriggerInfoType enum instead of a
  string constant. No functional change otherwise.


  0.2.0.0: Cookie file upload (for authenticated/age-restricted YouTube access) and
  per-library scan scoping. Trailer search/download and folder migration logic
  ported from the standalone script still lands in a follow-up release - this
  build is for settings/wiring testing only, it does not fetch trailers yet.


  0.1.0.0: Initial plugin skeleton - configuration page and scheduled task wiring.
