version: "0.9.0.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Finds and downloads missing local trailers for movies and TV series from YouTube via yt-dlp."
imageUrl: "https://raw.githubusercontent.com/grexe/jellyfin-trailer-fetcher/main/plugin/images/logo.png"
description: >
  Scans the library for missing local trailers - movies and TV series - searches
  YouTube via yt-dlp using sequel-aware title matching, downloads matches into
  "<title>-trailer.ext", and can migrate movies into their own folder - required for
  Jellyfin to recognize a local movie trailer at all when movies otherwise share a
  flat folder (see https://github.com/jellyfin/jellyfin/issues/10077); a series
  always already has its own folder, so that step doesn't apply there.
category: "General"
owner: "grexe"
artifacts:
- "Jellyfin.Plugin.TrailerFetcher.dll"
changelog: >
  0.9.0.0: Theme song fetching (0.8.26.0-0.8.29.0) is now solid - marking it with a
  proper minor version bump rather than another patch-level one, since a whole new
  feature landing under a patch bump undersold it. Final fix in this run: a folder
  migrated in an *earlier* run never got its permissions healed by 0.8.28.0/0.8.29.0
  - MigrateToOwnFolder's own "already in its own folder" check returns early before
  ever reaching the permission-matching call, so only a folder actually created in
  the *same* run as a theme song fetch benefited. Confirmed live: a movie's folder
  from a previous migration stayed at the wrong (non-group-writable) permissions
  indefinitely, even on runs that successfully wrote a theme song into it (because
  the process happened to already own the folder by then, masking the gap). Now
  re-applies permission/group healing to a movie's own folder on every run that
  fetches a theme song, not just the run that first created it.


  0.8.29.0: Made 0.8.28.0's permission/group matching genuinely POSIX-portable
  instead of Linux-only, per feedback that the underlying mechanisms don't actually
  need Linux specifically. File.GetUnixFileMode/SetUnixFileMode is a portable .NET
  API that works on any Unix-like target - verified directly, it already worked
  correctly on macOS once unblocked. The only genuinely non-portable part was
  `chgrp --reference=`, a GNU-only extension BSD's chgrp (macOS) doesn't support -
  replaced with resolving the reference file's numeric group id via `stat` (its
  format flag differs between BSD/macOS `-f` and GNU/Linux `-c`, handled
  per-platform, both verified directly) and passing that plain number to `chgrp`,
  which is standard usage on every chgrp implementation. Verified the whole thing
  end to end on macOS, including the file-vs-directory execute-bit handling
  (a directory reference's execute bit correctly carries over to a new directory
  target but is correctly stripped when the target is a regular file).


  0.8.28.0: Root-caused and fixed the actual permission problem behind 0.8.27.0,
  rather than only handling the failure gracefully. Confirmed live: media added to
  the library by different users/processes (e.g. copied in over SMB as one user,
  with Jellyfin's own containerized process running as another) can end up with
  permission bits that deny write access to whichever of them didn't create a given
  file/folder, even when both share the same group. On Linux, any file or folder
  this plugin creates (a downloaded trailer/theme song, or a new folder from
  migration) now gets its permission bits and group matched to the movie/series'
  own existing file or folder via a new UnixPermissions.MatchTo helper (File.Set
  UnixFileMode plus `chgrp --reference=`, verified both mechanisms directly before
  wiring them in). Deliberately never touches the file's owner, since changing that
  generally needs root - matching group and permission bits was enough to solve the
  reported case, since the differently-owned files already shared a group. No
  configuration needed; best-effort and silently logged on failure, same as
  everywhere else in this plugin that touches the filesystem.


  0.8.27.0: Fixed a permission error crashing the entire run instead of just skipping
  the affected item. Confirmed live: a theme song download hit
  System.UnauthorizedAccessException on the underlying NFS share, and it propagated
  all the way out of the scheduled task - crashing the whole run, not just that one
  movie's theme song. Root cause: UnauthorizedAccessException does not inherit from
  IOException in .NET (verified directly - reproduced a real permission-denied
  File.Copy locally and confirmed its exact exception type), so every
  "catch (IOException ...)" around a file operation in this codebase - trailer
  rename/migrate, trailer/theme song download, trailer upgrade backup/restore -
  silently let a permission-denied failure through uncaught. Broadened every one of
  them (14 call sites across MovieFileOperations.cs, FetchTrailersTask.cs, and
  YtDlpClient.cs) to also catch UnauthorizedAccessException. Also fixed a second,
  subtler instance of the same gap: the temp-file cleanup in a `finally` block after
  a failed copy/move wasn't wrapped in any try/catch at all, so even after fixing
  the primary catch, that cleanup step alone (deleting the same permission-denied
  file) could still crash the run on its own - now handled the same way.


  0.8.26.0: Added an opt-in "Fetch theme songs" setting. When on, each movie/series
  also gets a local theme.mp3, looked up on ThemerrDB
  (https://github.com/LizardByte/ThemerrDB) by TMDb id - the same community-curated
  database the Themerr-jellyfin plugin uses, so an item only gets a theme song here
  if Themerr would have offered one too. Only the lookup is shared with Themerr; the
  download goes through this plugin's own yt-dlp pipeline (rate-limit pacing, retry,
  client fallback) instead of Themerr's YoutubeExplode-based downloader, which fails
  outright on plenty of videos yt-dlp handles fine (the trigger for this feature:
  confirmed live, Themerr's own log showed
  YoutubeExplode.Exceptions.VideoUnavailableException on a video that downloaded
  without issue via yt-dlp). A movie only gets a theme song once it's confirmed to
  be in its own dedicated folder - unlike a trailer's per-movie filename, theme.mp3
  is a fixed name that would otherwise be misattributed across every movie sharing a
  folder; a TV series always already has its own folder. An existing theme.mp3,
  whether user-provided or from Themerr, is never touched. Off by default.


  0.8.25.0: Two visual fixes to 0.8.23.0's settings-page reorg, confirmed live. (1)
  Group headings ("Scanning", "Quality", ...) were barely distinguishable from
  regular field labels since they reused the same styling - they're now visibly
  bigger/bolder with an underline, and each group's fields are indented beneath it
  so the grouping is actually readable at a glance. (2) The "Rate-limit retry delay"
  field's disabled state (when "Retry once if rate-limited" is off) wasn't visually
  obvious - this page has no stylesheet backing a :disabled look (a &lt;style&gt;
  block gets dropped by Jellyfin's dashboard injection), so the whole field is now
  explicitly dimmed via inline style, toggled live with the checkbox. Verified both
  in a real browser against a local stub of the actual configPage.html.


  0.8.24.0: Fixed a movie being silently skipped over a missing file extension.
  Confirmed live: "Operation Broken Arrow.mpg" - a legitimate older DVD-era rip -
  was rejected outright ("Not a video file (extension: .mpg)") and never got a
  trailer at all, purely because .mpg wasn't in the recognized-video-extensions
  list. Added .mpg plus the rest of the common real-world video containers that
  list was also missing (.mpeg, .flv, .3gp, .3g2, .divx, .asf, .rm, .rmvb, .mts,
  .m2v, .ogv), not just the one that happened to get reported.


  0.8.23.0: Reorganized the settings page for readability - purely cosmetic, no
  configuration keys changed. The last-run summary now shows just the one-line
  header (date, duration, stop reason) with the full per-movie/series breakdown
  behind a "Details" toggle instead of always being fully expanded. Every other
  setting is grouped under "Scanning" (libraries, library-scan trigger, max trailer
  duration), "Quality" (minimum resolution, upgrade toggle), "Organisation" (rename,
  folder migration), "Network" (cookies, request delay, rate-limit retry), and
  "Debugging and Testing" (dry run, verbose logging) - previously one long
  unstructured list. "Rate-limit retry delay" is now visibly disabled whenever
  "Retry once if rate-limited" is off, instead of being editable but inert.


  0.8.22.0: Added an opt-in "Upgrade low-quality trailers" setting. When on, a
  movie/series that already has a local trailer still gets re-checked against a
  configurable "Minimum trailer quality" (default 720p, via ffprobe) and re-searched
  if it falls short - most usefully for trailers that landed on the mweb fallback's
  ~360p cliff (see 0.8.21.0). The existing file is only ever replaced by a genuinely
  higher-resolution download: both are probed and compared after the new attempt
  completes, so a re-attempt that can't beat it, or that also lands on a low-quality
  fallback, leaves the original trailer untouched rather than trading one low-quality
  file for another. Off by default - re-checking every under-quality trailer on every
  run until it clears the bar means more yt-dlp traffic (and so more rate-limit
  exposure) than a one-time pass, until the library catches up.


  0.8.21.0: Improved trailer quality. The download format selector was restricted to
  [ext=mp4]/[ext=m4a] video/audio only - YouTube's actual highest-resolution streams
  are frequently VP9/AV1-in-webm only, so this could silently cap quality below what
  was genuinely available, confirmed by comparing format listings for real trailer
  searches. Now uses yt-dlp's own true default selector (bestvideo*+bestaudio/best,
  no container restriction) while --merge-output-format still remuxes the result
  into .mp4 to match the fixed trailer filename - Jellyfin transcodes on the fly for
  any client that can't direct-play the resulting codec, same as for any other video.
  Separately, confirmed by hand that the existing mweb fallback tier (used when the
  higher-quality adaptive formats need a PO token this plugin doesn't provide) can
  silently settle for an old muxed format capped around 360p - a real quality cliff
  that was previously indistinguishable in the log from a normal download. That
  retry's log line now says so explicitly.


  0.8.20.0: Two fixes from last night's live run, confirmed against the actual log.
  (1) The "retry once if rate-limited" flag never re-armed after a successful retry:
  once used, it stayed used for the rest of the run, so a large backlog that
  re-triggers YouTube's rate limit a second time later in the same run gave up
  immediately instead of getting its own retry. It now resets after every
  movie/series that completes without hitting the limit again - proof the limit
  actually lifted, not just a lucky moment - so each new rate-limit encounter gets
  its own single retry, same as the first. (2) The settings page and log summary
  showed "0" for TV series stats when the run got rate-limited/cancelled entirely
  during the movies phase (movies are always processed first) and series were never
  reached at all - indistinguishable from "reached every series and matched none".
  Both now show "n/a" for a phase that was never started, distinct from a genuine
  zero count.


  0.8.19.0: Fixed a cosmetic logging quirk: a movie sitting directly in the library
  root (no subfolder) made "*** Entering directory: ." print a bare "." instead of a
  useful name, since Path.GetRelativePath returns "." when the two paths are equal.
  PathDisplay.Relative now falls back to the library root's own folder name in that
  case, the same way every subfolder is already shown by its own name rather than a
  path fragment.


  0.8.18.0: A run that gets YouTube-rate-limited can now wait and retry once instead
  of always stopping immediately. There's no reliable way to know when the limit
  actually lifts - YouTube's own message only states an upper bound ("...for up to
  an hour") - so this is a single bounded retry, not a backoff loop: on the first
  rate limit, the run waits a configurable delay (new "Rate-limit retry delay"
  setting, default 65 minutes - a bit past YouTube's own stated ceiling) and then
  resumes the same run from wherever it stopped (not a full restart), controlled by
  a new "Retry once if rate-limited" toggle (on by default). If the retry also gets
  rate-limited, the run stops for good rather than waiting and retrying again -
  continuing to hammer an apparently-still-active limit doesn't help and risks
  making it worse.


  0.8.17.0: Two small polish items from live testing. (1) The rate-limit ERROR log
  line is now a fixed, short message ("...rate-limited by YouTube for up to an hour.
  Stopping the run now.") with a link to yt-dlp's own wiki page on the condition,
  instead of extracting/reformatting yt-dlp's raw stderr text. (2) The settings
  page's last-run-summary table had a generic "Metric / Value" header for movies but
  correctly showed "TV series" as a section label further down - movies now get
  their own "Movies" section label the same way, and the generic header row (which
  added nothing the section labels don't already say) was dropped.


  0.8.16.0: Trimmed the rate-limit ERROR log line. 0.8.15.0's log included yt-dlp's
  entire raw warning paragraph verbatim - a lead-in sentence, the actual rate-limit
  notice, then yt-dlp's own "-t sleep" suggestion and a wiki URL, most of which is
  noise once our own message already explains what's happening and why. Now logs
  just the one sentence that matters ("The current session has been rate-limited by
  YouTube for up to an hour.") plus a short reason for stopping early. No behavior
  change, log output only.


  0.8.15.0: Handle YouTube's own rate limiting instead of grinding through it.
  Confirmed live on a long run: once YouTube rate-limits a session ("The current
  session has been rate-limited by YouTube for up to an hour"), no client/format
  fallback helps, and continuing on to retry other clients or move to the next
  movie/series just wastes time against a block that won't lift itself any sooner -
  possibly making it worse. YtDlpClient now detects this specific condition and
  throws a distinct YouTubeRateLimitedException that propagates straight past every
  retry tier and out of the movie/series loop, stopping the whole run early - with
  whatever was found before it hit still logged/persisted the same way a cancelled
  run's partial summary already is (RunSummary's Aborted flag is now a StopReason
  string so the summary/log can say "YouTube rate-limited this session" specifically,
  not just "cancelled"). Also added a "Delay between requests" setting (default 3s,
  configurable, 0 disables it) - a plain per-invocation delay before every yt-dlp
  call, sized for this plugin's actual pattern of many short-lived separate
  invocations rather than yt-dlp's own "-t sleep" preset (which sleeps up to 20s per
  download, tuned for one long-running session working through a playlist).


  0.8.14.0: Added a "Verbose logging" setting. Each rejected search candidate's
  specific reason ("Title mismatch: ...", "Duration > 300s: ...") is now only logged
  when it's turned on (off by default) - a movie/series that needs several fallback
  search stages before finding (or giving up on) a trailer can generate dozens of
  these lines, burying the handful that actually matter for a normal run. Each
  search stage's overall outcome (what was searched, found or not) is still always
  logged regardless; this only trims the per-candidate detail within a stage, which
  matters most when actively diagnosing why a specific movie/series isn't finding a
  trailer it should.


  0.8.13.0: Two fixes. (1) 0.8.12.0 over-corrected: forcing player_client=web for
  EVERY download whenever a cookies file was merely configured (regardless of
  whether that specific video needed it) reintroduced 0.8.10.0's "Only images are
  available for download" failure for ordinary, non-restricted videos, confirmed
  live. DownloadAsync now has three tiers instead of two: try the default client
  first (as before), retry with player_client=web only if that failed AND cookies
  are configured (a targeted shot at the age-verification case), then fall back to
  mweb if that still fails too - so most downloads still get the full benefit of
  yt-dlp's unrestricted default selection, and cookies only narrow things down after
  a first attempt has already failed. (2) Fixed a year-*range* ("(1994-2019)", an
  anthology/box-set's airing span) not being recognized as a unit by the
  year-extraction regex (built for a single year alone in parens) - only the first
  year was getting stripped, leaving "( -2019)" behind in the resolved title.
  Confirmed live on a Shinichiro Watanabe anthology folder. Fixed in the shared
  TitleMatching.CleanMediaTitle (not series-only - a movie box set could hit the
  same pattern). Verified both fixes: the year-range case plus a set of regression
  checks (single year, no year, a movie box set example) for the second, and a
  read-through confirming no duplicate/conflicting player_client flags for the
  first (no live cookies+age-gate video available to reproduce the full scenario
  against).


  0.8.12.0: Fixed a regression from 0.8.10.0 that broke cookies-based
  authenticated/age-restricted access: an age-restricted video failed with "Sign in
  to confirm your age" despite a valid, verified-account cookies.txt being uploaded.
  0.8.10.0 removed the player_client override entirely, but it had been doing two
  different jobs - restricting to a now-stale "web,android,ios" list (correctly
  removed) and forcing player_client=web whenever cookies were configured (needed,
  and removed by mistake): a cookies file only actually takes effect on the "web"
  client, since the app-style clients (android, ios, mweb, tv, android_vr, ...)
  authenticate via device tokens and silently ignore a cookies file regardless of
  --cookies being set. CommonArgs now forces player_client=web again specifically
  when a cookies file is configured. Also updated DownloadAsync's mweb retry
  fallback to skip itself (retrying the same web-forced command instead) whenever
  cookies are set, since mweb doesn't honor cookies either and falling back to it
  would silently drop the authenticated access for that attempt, and would have
  sent yt-dlp two conflicting player_client overrides in the same command.


  0.8.11.0: Small polish from live testing. The candidate-rejection log line was
  ambiguous ("Title mismatch or missing keyword") when the code actually knows which
  one it was - split into two distinct, specific messages ("Title mismatch: ..." vs
  "Title matches, but no trailer keyword (trailer/teaser/...): ..."). Also dropped a
  manually-added inner quote pair around the candidate title in that message, which
  stacked with the logging backend's own automatic quoting the same way earlier
  quoting bugs did.


  0.8.10.0: Found and fixed the actual root cause of the "Only images are available"
  failures (deno confirmed fully functional in 0.8.9.0's diagnostics). Removed the
  hardcoded --extractor-args youtube:player_client=web,android,ios override - it made
  sense when the standalone script was written, but confirmed live and by hand: it's
  become actively harmful as YouTube's defenses evolved (android/ios are now
  routinely filtered by SABR/PO-token requirements), while yt-dlp's own default
  client selection (actively maintained upstream to route around exactly this) found
  proper adaptive formats via a different client. That default choice isn't fully
  reliable either though - confirmed live and reproduced consistently by hand: its
  first-choice client's formats can extract fine but 403 on the actual download.
  DownloadAsync now tries the default first, and retries with an explicit
  player_client=mweb on failure specifically (not just repeating the same command) -
  mweb's own adaptive formats get filtered the same way, but it then falls back
  cleanly to a legacy, reliably-downloadable format instead of failing outright,
  confirmed consistent across repeated attempts. Verified the whole two-tier sequence
  end to end against the exact failing video before shipping.


  0.8.9.0: Diagnostic-only addition. The previous release's added logging revealed
  the real yt-dlp error: "WARNING: Only images are available for download" - meaning
  YouTube served no real video/audio formats at all on that server, only storyboard
  images, which happens when YouTube enforces SABR-only streaming and the signature
  challenge solver can't actually run - even when a JS runtime binary is *present* on
  disk, since that doesn't prove it actually executes successfully from inside
  Jellyfin's own process (permissions/sandboxing can differ from a manual test).
  DependencyProvisioner now runs "deno --version" in that same execution context -
  once after downloading it, and once on every run where it was already present -
  and logs the result, to get a definitive per-run answer instead of inferring
  deno's health from a downstream symptom that has more than one possible cause.


  0.8.8.0: Three fixes from live testing. (1) The "Last run" summary is now
  cancellation-safe: cancelling a run used to skip saving the summary entirely,
  leaving a stale summary from a previous run on display - the movie/series loops
  are now wrapped so the summary is always logged/persisted with whatever was found
  before it stopped (marked "cancelled - partial results"), then the cancellation is
  rethrown so Jellyfin's TaskManager still correctly reports it as cancelled rather
  than completed. (2) The summary now only shows a Movies or TV Series section for
  libraries actually in scope for that run, instead of always showing "Total Movies
  in Library: 0" for a run scoped to series-only libraries. (3) Replaced the full ISO
  "Completed" table row with a compact date + time + duration line above the table
  (a new DurationSeconds field, tracked from a start timestamp captured at the top of
  ExecuteAsync). Also added a single retry-worthy diagnostic: yt-dlp's WARNING lines
  (not just the final ERROR line) are now logged on a probe/download failure, and the
  resolved yt-dlp/deno paths are logged once per run - added while investigating a
  report of every download failing with "Requested format is not available" for
  every query on one server, to help pin down whether that server's managed deno
  binary is actually working.


  0.8.7.0: Two fixes. The settings page's "Last run" table styling never actually
  applied (confirmed against 0.8.6.0, incognito included): Jellyfin's dashboard loads
  a plugin's config page by injecting its body content into the existing app shell,
  which drops the page's own <head> - a <style> block there silently never took
  effect. Rewrote the table to style itself entirely via inline styles set in JS
  instead, which can't be dropped that way. Also added a single retry to
  YtDlpClient.DownloadAsync: a download that failed with "Requested format is not
  available" during a real run was verified (by hand, twice, with the exact same
  command) to succeed immediately after - a transient hiccup, not a persistent
  problem with that video - so one retry is cheap insurance against exactly that
  without masking a genuinely unavailable video, which will just fail again on the
  retry too.


  0.8.6.0: Fixed a high-impact porting regression in TitleMatching.TitleMatches: the
  YouTube result title was never lowercased before the phrase-match regex ran against
  it, while the candidate side always was - and .NET's Regex.Match is case-sensitive
  by default, so "blue lock" (candidate) silently never matched "Blue Lock" (a
  title-cased YouTube title) even though they're the same title. The standalone
  script avoids this by lowercasing yt_title once at the top of its filter function;
  the C# port dropped that step. This was very likely the dominant cause behind most
  search-based "Title mismatch" rejections seen throughout testing (movies and
  series both, not just the two TV cases that surfaced it) - confirmed against the
  exact failing case ("Blue Lock - Official Trailer..." now correctly matches "Blue
  Lock"). Also fixed SeriesTitleCleanup leaving an empty "( )" behind when the
  season-range fragment it removes was fully inside a parenthetical ("Blue Lock
  (Season 1)" -> "Blue Lock ( )" -> now "Blue Lock").


  0.8.5.0: Fixed wrong search queries for TV series bundled as a multi-season
  folder (e.g. "... S1 - S5 [Full Series] ..."): a season-range fragment ("S1",
  "S1 - S5", "Season 1-5") was surviving into the resolved title, since nothing in
  the shared title-cleanup logic knows about season ranges (a movie title never has
  one) - confirmed live on "Food Wars! (Shokugeki no Soma)", whose search queries
  all carried a spurious "S1" because Jellyfin's own matched Name already had it
  before the plugin ever saw it. Added Services/SeriesTitleCleanup.cs, a small
  series-only post-processing step (deliberately not folded into the shared
  ItemMetadata/TitleMatching, since this noise is TV-specific) that strips a
  season-range fragment from the resolved title/variants before they're used for
  search or the trailer filename. Verified against the exact failing case plus
  several variants (Season 1-4, S01-S04) and confirmed it leaves unrelated
  content alone (e.g. a hypothetical title like "S1mone").


  0.8.4.0: The settings page's "Last run" summary is now a real styled HTML table
  (header row, right-aligned values, a distinct section divider for TV series
  counts) instead of an unstyled table with no visual structure.


  0.8.3.0: Fixed a title-matching bug that broke every search for "5 Centimeters per
  Second" (and would break any title genuinely starting with a number - "12 Monkeys",
  "300", "8 Mile", etc.): the scene-release-cleanup heuristic stripped any leading
  "number + whitespace" as if it were a track/episode number, with no structural
  signal distinguishing that from a title that just starts with a digit. Removed that
  overly broad rule - kept the punctuation-anchored one ("01. ", "01 - ", "01_",
  still needed for real scene-numbered filenames) since a genuine title essentially
  never has a period/dash/underscore directly after a leading number. Verified against
  both the exact failing title and a set of real scene-numbered filenames to confirm
  the legitimate case still works. This heuristic was ported verbatim from the
  standalone script, which likely has the same latent bug.


  0.8.2.0: Fixed a real miss reported from live testing: probing a candidate
  (yt-dlp -j --skip-download) hard-failed with "Requested format is not available"
  for some videos, discarding otherwise-fully-extracted title/duration/webpage_url
  metadata over a format-selection problem that doesn't matter during a metadata-only
  probe. Added --ignore-no-formats-error to the probe call specifically (not the
  actual download, which does need a real format) - verified against the exact
  failing video from the report: probing now returns full metadata, and the
  subsequent download succeeds too (yt-dlp falls back to a pre-merged format when the
  preferred bestvideo+bestaudio combo isn't available, e.g. due to a missing PO
  token). Not series-specific despite surfacing during series testing - RemoteTrailers
  URLs are sourced identically for movies and series, this was always a latent gap in
  the movie path too.


  0.8.1.0: Refactor - per feedback, verified the movie/series duplication from 0.8.0.0
  and found the SeriesMetadata.cs/SeriesTrailerSources.cs title/year-resolution and
  source-query-building logic was byte-for-byte identical to MovieMetadata.cs/
  TrailerSources.cs aside from variable names and comments (both are plain BaseItem
  lookups with nothing movie- or series-specific in them), so there was no actual
  behavior to isolate by keeping them separate - only a maintenance burden of every
  future fix needing to be applied twice. Merged them into one shared
  Services/ItemMetadata.cs and widened TrailerSources.Build to take a BaseItem.
  ProcessMovieAsync/ProcessSeriesAsync in FetchTrailersTask.cs stay separate, since
  what they actually do genuinely differs (rename/migrate + file-specific validity
  checking for movies vs. a plain folder-exists check for series). No functional
  change.


  0.8.0.0: Added TV series support - series-level trailers only (Services/
  SeriesMetadata.cs, Services/SeriesTrailerSources.cs), sharing the same library
  selection as movies but otherwise deliberately kept as a fully separate code path
  from the movie logic rather than a shared generic one, so a change intended for one
  media type can't silently affect the other. Checked Jellyfin's actual entity model
  first: Series has its own LocalTrailers/RemoteTrailers (same shape as Movie), but
  Season has no equivalent property at all - despite Jellyfin's docs showing a
  trailers/ folder example nested under a season folder - so season-level trailers
  aren't implemented until that's verified against a real library. No rename/migrate
  step for series: a series always already lives in its own dedicated folder. The
  settings page's "Last run" summary and the main log's TRAILER SYNC SUMMARY both
  show series counts alongside the movie ones now.


  0.7.1.0: Logged paths (directory entries, rename/migration targets) now show
  relative to the movie's own library root (via BaseItem.GetTopParent()) instead of
  the full container path, so log lines aren't dominated by a repeated mount-point
  prefix. Also fixed one path that was still logged in full (unlike its sibling
  lines) in the rename-folder failure case. No behavior change - display only.


  0.7.0.0: First real-run fixes from live testing. Fixed a class of log-quoting bugs
  where a value already wrapped in manual quotes in the message template got
  double-quoted (the logging backend quotes string values by default) - e.g. a
  library name rendering as 'library was 'Anime-Filme'". Also dropped the library's
  GUID from that line (not useful in the UI) and fixed a related bug where a
  DRY-RUN prefix fragment spliced in through its own placeholder got quoted on its
  own. Tightened the yt-dlp/deno download timeout from 5 minutes to 2 and gave it a
  clear, actionable message on failure (mentioning GitHub's release CDN
  specifically) instead of leaving a run looking hung - a download that times out
  no longer masks a deliberate task cancellation as an ordinary download failure,
  either. The last run's summary (the same numbers logged as "TRAILER SYNC
  SUMMARY") is now also persisted and shown on the settings page
  (GET /TrailerFetcher/LastRunSummary), not just buried in the log.


  0.6.1.0: Removed the "yt-dlp executable" setting entirely - the plugin now always
  uses its own self-managed yt-dlp/deno (see 0.6.0.0), never a system installation.
  Letting that path vary would mean supporting whatever yt-dlp version/flag
  combination a user happens to have installed, instead of the one this plugin is
  actually built and tested against - and this plugin's whole point is working out
  of the box on a stock Jellyfin install with no server-side setup or path fiddling.


  0.6.0.0: yt-dlp and the deno JavaScript runtime it needs no longer have to be
  installed on the server - the plugin now downloads and manages both itself
  (Services/DependencyProvisioner.cs), verifying checksums and self-updating yt-dlp
  every 24h, so it works on a stock jellyfin/jellyfin container with no customization.
  The "yt-dlp executable" setting is now empty by default (auto-managed) instead of
  defaulting to "yt-dlp"; set it to a specific command/path to opt back out and use
  your own installation instead. Evaluated and rejected two alternatives (documented
  in the README): the Ytdlp.NET fluent wrapper package (still needs the same
  underlying binary, and its metadata API is single-URL only - doesn't support this
  plugin's multi-candidate probe-then-filter strategy) and MeTube (a second
  container/service with no metadata-only probe API and a separate cookie config).


  0.5.0.0: Ported the standalone script's actual trailer fetching: title/year
  resolution, multi-stage YouTube search query building, duration+title/keyword
  candidate filtering, original-file renaming, and folder migration all now run for
  real (FetchTrailersTask was previously a wiring stub that only counted movies).
  Runs entirely in-process against ILibraryManager - no NAS path mapping, no HTTP
  calls to Jellyfin's own API, no browser cookie jar (uses the uploaded cookies.txt),
  library scans triggered via ILibraryManager.QueueLibraryScan() directly. Shells out
  to a yt-dlp executable (new "yt-dlp executable" setting, default "yt-dlp" on PATH)
  for the actual YouTube search/download, since there's no C# equivalent - REQUIRES
  yt-dlp (and a JS runtime, deno or node) to be installed wherever the Jellyfin server
  process itself runs; ffmpeg is reused from Jellyfin's own configured encoder, no
  separate install needed. See the README's new Requirements section.


  0.4.2.0: Fixed the scheduled task showing up in its own untranslated "Library"
  group instead of joining the real Library group on non-English servers. The
  task's Category was the literal string "Library", but built-in library tasks
  (e.g. RefreshMediaLibraryTask) get their Category from
  ILocalizationManager.GetLocalizedString("TasksLibraryCategory") - the same
  server-side-localized key that this task now uses too, so both group under the
  same (correctly translated) label.


  0.4.1.0: Fixed the "0 movies found" library-scoping bug, confirmed via diagnostic
  logging added in 0.4.0.0 (1026 movies found server-wide, 0 when scoped to a
  library known to contain real movies). The fix was hand-building
  InternalItemsQuery.TopParentIds from VirtualFolderInfo.ItemId directly - that id
  does not reliably match what TopParentIds-based filtering expects, since
  TopParentIds is normally computed internally by LibraryManager from a resolved
  parent item, not meant to be built by callers from a raw id string. Now resolves
  each configured library to its actual item via ILibraryManager.GetItemById() and
  queries it via InternalItemsQuery.Parent instead (one query per selected library,
  merged).


  0.4.0.0: Fixed a real stability bug: the compiled assembly never had its own
  <Version>/<AssemblyVersion> set, so it silently defaulted to .NET's "1.0.0.0"
  regardless of what build.yaml/manifest.json declared. That mismatch between the
  assembly's actual version and what Jellyfin installed/tracked caused the dashboard
  to revert to "1.0.0.0" after a task run or server restart, and made uninstall fail
  outright. package.sh now keeps build.yaml's version in sync with the csproj
  automatically, so this can't drift again. Also: moved the scheduled task into the
  "Library" category (no need for its own single-entry category), fixed a stray
  quoted-string artifact in one log line ("librar\"y\"" -> "library"), and added
  diagnostic logging (every known library's id/name/collection-type, plus an
  unscoped movie count for comparison) to help track down a reported "0 movies
  found" when scoped to a specific library - not yet reproduced locally.


  0.3.2.0: This plugin's own log entries (scheduled task runs, cookie upload/removal,
  etc.) now also get mirrored into their own file
  (plugins/Jellyfin.Plugin.TrailerFetcher/trailer-fetcher.log) via a scoped
  ILoggerProvider, so a run can be inspected without wading through the main server
  log. No change to what's logged, just where.


  0.3.1.0: Clearer cookies-file guidance on the settings page - no browser exposes a
  plain "cookies.txt" to point to (Firefox stores cookies in an SQLite database, not
  a text file); names the actual export extension needed ("Get cookies.txt LOCALLY").
  Also fixed the catalog logo being cropped (padded the artwork so a wider-than-tall
  crop doesn't clip it) and replaced it with a solid-background badge.


  0.3.0.0: Retargeted to Jellyfin 10.11.x (net9.0; 10.11.x's packages dropped net8.0
  support) - TaskTriggerInfo.Type is now the TaskTriggerInfoType enum instead of a
  string constant. No functional change otherwise.


  0.2.0.0: Cookie file upload (for authenticated/age-restricted YouTube access) and
  per-library scan scoping. Trailer search/download and folder migration logic
  ported from the standalone script still lands in a follow-up release - this
  build is for settings/wiring testing only, it does not fetch trailers yet.


  0.1.0.0: Initial plugin skeleton - configuration page and scheduled task wiring.
