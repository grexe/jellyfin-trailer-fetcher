[project]
name = "jellyfin-trailer-fetcher"
version = "0.1.0"
description = "Automatically download missing trailers for Jellyfin movies using yt-dlp"
readme = "README.md"
authors = [
    { name = "Gregor B. Rosenauer", email = "gregor@senauer.ro" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "yt-dlp>=2026.7.4",
]

[project.scripts]
jellyfin-trailer-fetcher = "jellyfin_trailer_fetcher:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
